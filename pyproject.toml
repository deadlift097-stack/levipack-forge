[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levipack-forge"
version = "0.1.0"
description = "Build, inspect, manage and convert LeviLauncher .levipack containers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
levipack = "levipack_forge.cli:main"

[tool.setuptools]
packages = ["levipack_forge"]
